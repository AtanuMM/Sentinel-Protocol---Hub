    server {
        listen 80;
        server_name localhost;

        client_body_in_single_buffer on;
        client_max_body_size 100M;  
        client_body_buffer_size 16M;

        lua_code_cache on;
        # add_header 'Access-Control-Allow-Origin' $http_origin always;
        # add_header 'Access-Control-Allow-Credentials' 'true' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, x-reset-token' always;
        location / {

            # Handle preflight requests (Optional If needed)
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' "$http_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, x-uid, X-Requested-With, x-reset-token' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }
            # CORS headers for responses (Not needed its duplicate)
            # add_header 'Access-Control-Allow-Origin' $http_origin always;
            # add_header 'Access-Control-Allow-Credentials' 'true' always;
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            # add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, x-uid, X-Requested-With, x-reset-token' always;

            
            root /usr/share/nginx/html;
            index index.html;
            default_type text/html;
        }
        rewrite_by_lua_block {
            
            local skipAuth_routes = ngx.shared.skipAuth_routes
            local request_uri = ngx.var.request_uri
            local request_method = ngx.req.get_method()
            local path = request_uri:match("([^?]+)")
            local skipAuth_method = skipAuth_routes:get(path)

            -- Allow OPTIONS requests to bypass authentication
            if request_method == "OPTIONS" then
                return 204;
            end
            -- Check if the route is public
            if skipAuth_method == request_method then
                ngx.log(ngx.INFO, "Public route, skipping JWT validation: ", path)
                return
            end

            ngx.log(ngx.ERR, "DEBUG - Path: '", path, "', Method: '", request_method, "', Stored method: '", tostring(skipAuth_method), "'")

            -- JWT validation for non-public routes
            local jwt = require "resty.jwt"
            local cjson = require "cjson"
            local auth_header = ngx.var.http_authorization

            if not auth_header or not auth_header:find("Bearer") then
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say(cjson.encode({ error = "Missing or invalid token" }))
                return ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end

            local token = auth_header:sub(8)
            local jwt_obj = jwt:verify('vaultify@123', token)

            if jwt_obj.verified then
                ngx.req.set_header("X-User-ID", jwt_obj.payload.id)
                local user_json = cjson.encode(jwt_obj.payload)
                ngx.req.set_header("X-User-Info", user_json)
            else
                ngx.status = ngx.HTTP_UNAUTHORIZED
                ngx.say(cjson.encode({ error = "Unauthorized: Invalid token" }))
                return ngx.exit(ngx.HTTP_UNAUTHORIZED)
            end
        }
      
        location /api/v1/service/ {
            # Handle preflight requests (Optional If needed)
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin' "$http_origin" always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, x-uid, X-Requested-With, x-reset-token' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain';
                return 204;
            }
            # CORS headers for responses (Not needed its duplicate)
            # add_header 'Access-Control-Allow-Origin' $http_origin always;
            # add_header 'Access-Control-Allow-Credentials' 'true' always;
            # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            # add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, x-uid, X-Requested-With, x-reset-token' always;
            # Decrypt the request body if encryption is enabled

            access_by_lua_block {
                    local aes = require "resty.aes"
                    local cjson = require "cjson"
                    local config = ngx.shared.config
                    local encryption_enabled = config:get("encryption_enabled")

                    if not encryption_enabled then
                        ngx.log(ngx.ERR, "[DECRYPT] Encryption disabled by config")
                        return
                    end

                    ngx.req.read_body()
                    local encrypted_body = ngx.req.get_body_data()
                    local content_type = ngx.var.content_type or ""

                    ngx.log(ngx.ERR, "[DECRYPT] Content-Type: ", content_type)

                    -- 🛑 Skip decryption for multipart/form-data (e.g. file upload)
                    if content_type:find("multipart/form-data") then
                        ngx.log(ngx.ERR, "[DECRYPT] Skipping decryption for multipart/form-data")
                        return
                    end

                    if encrypted_body and content_type:find("application/json") then
                        ngx.log(ngx.ERR, "[DECRYPT] Decrypting encrypted body content")

                        local ok, err = pcall(function()
                            local key = "1234567890123456"
                            local iv = "1234567890123456"
                            local aes_128_cbc_with_iv = aes:new(key, nil, aes.cipher(128, "cbc"), { iv = iv })

                            local decoded = cjson.decode(encrypted_body)
                            if not decoded or not decoded.data then
                                error("Missing 'data' field in encrypted JSON payload")
                            end

                            local encrypted_data = decoded.data
                            local base64_decoded_data = ngx.decode_base64(encrypted_data)
                            local decrypted_body = aes_128_cbc_with_iv:decrypt(base64_decoded_data)

                            if not decrypted_body then
                                error("Failed to decrypt request body")
                            end

                            local body_table = cjson.decode(decrypted_body)
                            if not body_table then
                                error("Invalid JSON format in decrypted body")
                            end

                            ngx.req.set_body_data(cjson.encode(body_table))
                        end)

                        if not ok then
                            ngx.log(ngx.ERR, "[DECRYPT] Decryption error: ", err)
                            ngx.status = ngx.HTTP_BAD_REQUEST
                            ngx.say(cjson.encode({ error = "Invalid request body format" }))
                            return ngx.exit(ngx.HTTP_BAD_REQUEST)
                        end
                    end
                }



            # header_filter_by_lua_block {
            #     ngx.header["Content-Type"] = "application/json";
            #     ngx.header["Content-Type"] = "multipart/form-data";
            #     ngx.header.content_length = nil;
            # }
            #Setting the Headers automatically  
            header_filter_by_lua_block {
                local content_type = ngx.header["Content-Type"] or "nil"
                ngx.log(ngx.ERR, "[HEADER] Detected Content-Type: ", content_type)

                ngx.header["Access-Control-Allow-Origin"] = ngx.var.http_origin or "*"
                ngx.header["Access-Control-Allow-Credentials"] = "true"
                ngx.header["Access-Control-Allow-Methods"] = "GET, POST, PUT, DELETE, PATCH, OPTIONS"
                ngx.header["Access-Control-Allow-Headers"] = "Authorization, Content-Type, Accept, Origin, x-uid, X-Requested-With, x-reset-token"

                ngx.header["Content-Length"] = nil
            }

            

            # Encrypt response body if encryption is enabled
            # body_filter_by_lua_block {
            #     local aes = require "resty.aes"
            #     local cjson = require "cjson"
            #     local config = ngx.shared.config
            #     local encryption_enabled = config:get("encryption_enabled")

            #     if encryption_enabled then
            #         ngx.ctx.buffer = ngx.ctx.buffer or ""

            #         if ngx.arg[1] ~= "" then
            #             ngx.ctx.buffer = ngx.ctx.buffer .. ngx.arg[1]
            #             ngx.arg[1] = nil
            #         end

            #         if ngx.arg[2] then
            #             local response_body = ngx.ctx.buffer
            #             ngx.ctx.buffer = nil

            #             if #response_body == 0 then
            #                 ngx.log(ngx.ERR, "Response body is empty, not encrypting.")
            #                 return
            #             end

            #             local key = "1234567890123456"
            #             local iv = "1234567890123456"
            #             local aes_128_cbc_with_iv = aes:new(key, nil, aes.cipher(128, "cbc"), { iv = iv })
            #             local encrypted_body = aes_128_cbc_with_iv:encrypt(response_body)

            #             if encrypted_body then
            #                 local base64_encrypted = ngx.encode_base64(encrypted_body)
            #                 local json_response = '{"data":"' .. base64_encrypted .. '"}'
            #                 ngx.header["Content-Length"] = #json_response
            #                 ngx.arg[1] = json_response
            #             else
            #                 ngx.log(ngx.ERR, "Encryption failed.")
            #             end
            #         end
            #     end
            # }
            body_filter_by_lua_block {
                    local aes = require "resty.aes"
                    local cjson = require "cjson.safe"
                    local config = ngx.shared.config
                    local encryption_enabled = config:get("encryption_enabled")

                    ngx.ctx.buffer = ngx.ctx.buffer or ""

                    -- Log each chunk received
                    ngx.log(ngx.ERR, "[ENCRYPT] Chunk received, size=", #(ngx.arg[1] or ""), ", final_chunk=", ngx.arg[2])

                    if ngx.arg[1] ~= "" then
                        ngx.ctx.buffer = ngx.ctx.buffer .. ngx.arg[1]
                        ngx.arg[1] = nil
                    end

                    if ngx.arg[2] then
                        local response_body = ngx.ctx.buffer or ""
                        ngx.ctx.buffer = nil

                        local content_type = ngx.header["Content-Type"] or ""

                        ngx.log(ngx.ERR, "[ENCRYPT] Final response size: ", #response_body)
                        ngx.log(ngx.ERR, "[ENCRYPT] Status code: ", ngx.status)
                        ngx.log(ngx.ERR, "[ENCRYPT] Content-Type: ", content_type)
                        ngx.log(ngx.ERR, "[ENCRYPT] Raw backend response: ", response_body)

                        -- 🛑 Skip encryption for multipart responses or failed responses
                        if content_type:find("multipart/form-data") then
                            ngx.log(ngx.ERR, "[ENCRYPT] Skipping encryption due to Content-Type or status")
                            ngx.arg[1] = response_body
                            return
                        end

                        if not encryption_enabled then
                            ngx.log(ngx.ERR, "[ENCRYPT] Encryption disabled by config")
                            ngx.arg[1] = response_body
                            return
                        end

                        if #response_body == 0 then
                            ngx.log(ngx.ERR, "[ENCRYPT] Response body is empty, skipping encryption.")
                            ngx.arg[1] = '{"error":"Empty response from upstream"}'
                            ngx.status = 502
                            return
                        end

                        -- Proceed with encryption
                        local ok, encrypted_json = pcall(function()
                            local key = "1234567890123456"
                            local iv = "1234567890123456"
                            local aes_128_cbc_with_iv = aes:new(key, nil, aes.cipher(128, "cbc"), { iv = iv })

                            local encrypted_body = aes_128_cbc_with_iv:encrypt(response_body)
                            if not encrypted_body then
                                error("Encryption returned nil")
                            end

                            local base64_encrypted = ngx.encode_base64(encrypted_body)
                            return cjson.encode({ data = base64_encrypted })
                        end)

                        if not ok or not encrypted_json then
                            ngx.log(ngx.ERR, "[ENCRYPT] Encryption failed: ", encrypted_json)
                            ngx.arg[1] = '{"error":"Encryption failed at gateway"}'
                            ngx.status = 500
                            return
                        end

                        -- Set Content-Length only if safe
                        if not ngx.headers_sent then
                            ngx.header["Content-Length"] = #encrypted_json
                        else
                            ngx.log(ngx.ERR, "[ENCRYPT] Headers already sent; cannot set Content-Length")
                        end

                        ngx.arg[1] = encrypted_json
                    end
                }



            # Serve a static HTML page for the root URL
            

            location /api/v1/service/user-managment-service {
                rewrite ^/api/v1/service/user-managment-service(/.*)$ $1 break;
                proxy_pass http://user-managment-service/;
            }
            location /api/v1/service/notification-service {
                rewrite ^/api/v1/service/notification-service(/.*)$ $1 break;
                proxy_pass http://notification-service/;
            }
            location /api/v1/service/document-managment-service {
                rewrite ^/api/v1/service/document-managment-service(/.*)$ $1 break;
                proxy_pass http://document-managment-service/;
            }
            location /api/v1/service/property-service {
                rewrite ^/api/v1/service/property-service(/.*)$ $1 break;
                proxy_pass http://property-service/;
            }
            location /api/v1/service/cms-service {
                rewrite ^/api/v1/service/cms-service(/.*)$ $1 break;
                proxy_pass http://cms-service/;
            }
            location /api/v1/service/slots-booking-service {
                rewrite ^/api/v1/service/slots-booking-service(/.*)$ $1 break;
                proxy_pass http://slots-booking-service/;
            }
            location /api/v1/service/payment-service{
                rewrite ^/api/v1/service/payment-service(/.*)$ $1 break;
                proxy_pass http://payment-service/;
            }
            location /api/v1/service/tools-credit-cal-service{
                rewrite ^/api/v1/service/tools-credit-cal-service(/.*)$ $1 break;
                proxy_pass http://tools-credit-cal-service/;
            }

            location /api/v1/service/bidding-service {
                rewrite ^/api/v1/service/bidding-service(/.*)$ $1 break;
                proxy_pass http://bidding-service/;
            }
            
        }
    }
}