# Automatically scale worker processes to available CPU cores.
worker_processes auto;

events {
    # Maximum simultaneous connections accepted per worker.
    worker_connections 2048;
}

http {
    # Load standard MIME types. Keep JSON as the default for API responses.
    include mime.types;
    default_type application/json;

    # In containers, writing logs to stdout/stderr makes them visible via
    # `docker logs` and log aggregators.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Standard performance settings for serving files and proxy traffic.
    sendfile on;
    tcp_nopush on;

    # ----------------------------
    # GZIP COMPRESSION
    # Compress common text-based payloads returned by the gateway or upstream.
    # ----------------------------
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    # ----------------------------
    # RATE LIMITING
    # Shared zone used later by `limit_req` to protect API routes from bursts.
    # 10m is the size of the shared memory zone, 20r/s is per client IP.
    # ----------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # ----------------------------
    # LUA / OPENRESTY SHARED MEMORY
    # These shared dicts are available across workers and are used for:
    # - JWT related data
    # - public route registry
    # - runtime config flags
    # ----------------------------
    lua_shared_dict jwt_keys 10m;
    lua_shared_dict skipAuth_routes 10m;
    lua_shared_dict config 10m;

    # Lua package lookup path for OpenResty modules like resty.jwt/resty.aes.
    lua_package_path "/usr/local/share/lua/5.1/resty/?.lua;;";

    # Runs once when NGINX/OpenResty starts. Good place for static route config.
    init_by_lua_block {
        ngx.shared.config:set("encryption_enabled", true)

        local routes = ngx.shared.skipAuth_routes

        -- Public routes skip JWT verification in rewrite_by_lua_block.
        routes:set("/", "GET")
        routes:set("/health", "GET")
    }

    # ----------------------------
    # UPSTREAM SERVICES
    # Define backend microservices here. The current setup points to one user
    # service. If the service runs in Docker Compose, prefer the service name
    # instead of a fixed LAN IP.
    # ----------------------------
    upstream user_service {
        least_conn;
        #server 192.168.2.106:7001;
        server 192.168.1.77:7001;
        

    }

    upstream mdm_service {
        least_conn;
        #server 192.168.2.106:7002;
        server 192.168.1.77:7002;
        

    }
    
    upstream email_ftp_service {
        least_conn;
        server host.docker.internal:3001;
    }

    upstream ftp_ftp_service {
        least_conn;
        server host.docker.internal:3000;
    }

    upstream key_vault_service {
        least_conn;
        server host.docker.internal:8000;
    }

    server {
        # Main API gateway listener.
        listen 5000;

        # Request body limits for file uploads / encrypted payloads.
        client_max_body_size 100M;
        client_body_buffer_size 16M;
        default_type application/json;

        # Convert common upstream failures into JSON responses from this gateway.
        error_page 500 = /__gateway_error_500;
        error_page 502 = /__gateway_error_502;
        error_page 503 = /__gateway_error_503;
        error_page 504 = /__gateway_error_504;

        # ----------------------------
        # HEALTH
        # ----------------------------
        location /health {
            return 200 '{"status":"UP"}';
        }

        # Internal-only JSON error handlers used when proxy_intercept_errors is on.
        # These endpoints are not meant to be called directly by clients.
        location = /__gateway_error_500 {
            internal;
            return 500 '{"status":"error","code":500,"message":"Internal gateway error","service":"api-gateway"}';
        }

        location = /__gateway_error_502 {
            internal;
            return 502 '{"status":"error","code":502,"message":"Bad gateway","details":"The upstream microservice returned an invalid response or is unreachable","service":"api-gateway"}';
        }

        location = /__gateway_error_503 {
            internal;
            return 503 '{"status":"error","code":503,"message":"Service unavailable","details":"The upstream microservice is down or temporarily unavailable","service":"api-gateway"}';
        }

        location = /__gateway_error_504 {
            internal;
            return 504 '{"status":"error","code":504,"message":"Gateway timeout","details":"The upstream microservice did not respond in time","service":"api-gateway"}';
        }

        # ----------------------------
        # STATIC UI
        # Serves frontend files bundled into the gateway image.
        # ----------------------------
        location / {
            root /usr/share/nginx/html;
            index index.html;
            default_type text/html;
        }

        # ----------------------------
        # SHARED API GATEWAY LOGIC
        # IMPORTANT:
        # This block contains common gateway behavior such as rate limiting,
        # JWT validation, request decryption, response encryption, and CORS.
        # In NGINX, a more specific `location` block takes priority over this one.
        # That means `/api/v1/service/user-managment-service` below will match
        # first and WILL NOT automatically inherit this Lua logic.
        #
        # If you want auth/encryption to apply to a specific microservice route,
        # move the relevant directives into that route or refactor with includes.
        # ----------------------------
        location /api/v1/service/ {

            limit_req zone=api_limit burst=40 nodelay;

            # ----------------------------
            # CORS (PRE-FLIGHT)
            # Handles browser OPTIONS requests before the real API request.
            # ----------------------------
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, x-uid" always;
                return 204;
            }

            proxy_set_header X-Request-ID $request_id;

            # ----------------------------
            # AUTH + JWT
            # Executed in the rewrite phase before proxying.
            # Public routes are skipped based on the shared route registry.
            # ----------------------------
            rewrite_by_lua_block {
                local routes = ngx.shared.skipAuth_routes
                local path = ngx.var.uri
                local method = ngx.req.get_method()

                if routes:get(path) == method then
                    return
                end

                local jwt = require "resty.jwt"
                local cjson = require "cjson"

                local auth = ngx.var.http_authorization
                if not auth or not auth:find("Bearer") then
                    ngx.status = 401
                    ngx.say(cjson.encode({ error = "Missing token" }))
                    return ngx.exit(401)
                end

                local token = auth:sub(8)
                local res = jwt:verify("omni@123", token)

                if not res.verified then
                    ngx.status = 401
                    ngx.say(cjson.encode({ error = "Invalid token" }))
                    return ngx.exit(401)
                end

                ngx.req.set_header("X-User-ID", res.payload.id)
                ngx.req.set_header("X-User-Info", cjson.encode(res.payload))
            }

            # ----------------------------
            # REQUEST DECRYPTION
            # If request JSON is wrapped as { "data": "<base64>" }, decrypt it
            # and replace the upstream request body with plain JSON.
            # ----------------------------
            access_by_lua_block {
                local aes = require "resty.aes"
                local cjson = require "cjson"

                ngx.req.read_body()
                local body = ngx.req.get_body_data()
                local ct = ngx.var.content_type or ""

                if body and ct:find("application/json") then
                    local decoded = cjson.decode(body)
                    if decoded and decoded.data then
                        local key = "1234567890123456"
                        local iv = "1234567890123456"

                        local aes_obj = aes:new(key, nil, aes.cipher(128,"cbc"), {iv=iv})
                        local decrypted = aes_obj:decrypt(ngx.decode_base64(decoded.data))

                        if decrypted then
                            ngx.req.set_body_data(decrypted)
                        end
                    end
                end
            }

            # ----------------------------
            # RESPONSE HEADERS
            # Adjust headers after upstream response headers are received.
            # Content-Length is removed because response body size changes after
            # encryption in the body filter phase.
            # ----------------------------
            header_filter_by_lua_block {
                ngx.header["Access-Control-Allow-Origin"] = ngx.var.http_origin or "*"
                ngx.header["Access-Control-Allow-Credentials"] = "true"
                ngx.header["Content-Length"] = nil
            }

            # ----------------------------
            # RESPONSE ENCRYPTION
            # Buffers the full upstream response and encrypts it into:
            # { "data": "<base64 encrypted payload>" }
            # ----------------------------
            body_filter_by_lua_block {
                local aes = require "resty.aes"
                local cjson = require "cjson.safe"

                ngx.ctx.buffer = (ngx.ctx.buffer or "") .. (ngx.arg[1] or "")

                if ngx.arg[2] then
                    local key = "1234567890123456"
                    local iv = "1234567890123456"

                    local aes_obj = aes:new(key, nil, aes.cipher(128,"cbc"), {iv=iv})
                    local encrypted = aes_obj:encrypt(ngx.ctx.buffer)

                    if encrypted then
                        local final = cjson.encode({
                            data = ngx.encode_base64(encrypted)
                        })
                        ngx.arg[1] = final
                    else
                        ngx.arg[1] = '{"error":"Encryption failed"}'
                    end
                else
                    ngx.arg[1] = nil
                end
            }

            # ----------------------------
            # TIMEOUT + RETRY
            # These proxy retry settings only matter in a location that actually
            # proxies traffic with `proxy_pass`.
            # ----------------------------
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # ----------------------------
        # CONCRETE MICROSERVICE ROUTES
        # This route rewrites the public gateway path to the backend service path
        # and then proxies the request to `user_service`.
        #
        # Example:
        # /api/v1/service/user-managment-service/profile
        # becomes:
        # /profile
        #
        # Since this location is more specific than `/api/v1/service/`, this is
        # the block NGINX will choose for matching requests.
        # ----------------------------
        location /api/v1/service/user-managment-service {
            rewrite ^/api/v1/service/user-managment-service(/.*)$ $1 break;

            # Forward standard proxy context to the upstream service.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # When the upstream fails with 500/502/503/504, serve the JSON error
            # handlers defined above instead of the default NGINX HTML pages.
            proxy_intercept_errors on;
            proxy_pass http://user_service;
        }

        # ----------------------------
        # CONCRETE MICROSERVICE ROUTES
        # This route rewrites the public gateway path to the backend service path
        # and then proxies the request to `mdm_service`.
        #
        # Example:
        # /api/v1/service/mdm-managment-service/profile
        # becomes:
        # /profile
        #
        # Since this location is more specific than `/api/v1/service/`, this is
        # the block NGINX will choose for matching requests.
        # ----------------------------
        location /api/v1/service/mdm-managment-service {
            rewrite ^/api/v1/service/mdm-managment-service(/.*)$ $1 break;

            # Forward standard proxy context to the upstream service.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # When the upstream fails with 500/502/503/504, serve the JSON error
            # handlers defined above instead of the default NGINX HTML pages.
            proxy_intercept_errors on;
            proxy_pass http://mdm_service;
        }

                # ----------------------------
        # CONCRETE MICROSERVICE ROUTES
        # This route rewrites the public gateway path to the backend service path
        # and then proxies the request to `mdm_service`.
        #
        # Example:
        # /api/v1/service/ftp-ingestion/profile
        # becomes:
        # /profile
        #
        # Since this location is more specific than `/api/v1/service/`, this is
        # the block NGINX will choose for matching requests.
        # ----------------------------
        location /api/v1/service/ftp-ingestion {
            rewrite ^/api/v1/service/ftp-ingestion(/.*)$ $1 break;

            # Forward standard proxy context to the upstream service.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # When the upstream fails with 500/502/503/504, serve the JSON error
            # handlers defined above instead of the default NGINX HTML pages.
            proxy_intercept_errors on;
            proxy_pass http://ftp_ftp_service;
        }
        # ----------------------------
        # CONCRETE MICROSERVICE ROUTES
        # This route rewrites the public gateway path to the backend service path
        # and then proxies the request to `mdm_service`.
        #
        # Example:
        # /api/v1/service/mdm-managment-service/profile
        # becomes:
        # /profile
        #
        # Since this location is more specific than `/api/v1/service/`, this is
        # the block NGINX will choose for matching requests.
        # ----------------------------
        location /api/v1/service/email-ingestion {
            rewrite ^/api/v1/service/email-ingestion(/.*)$ $1 break;

            # Forward standard proxy context to the upstream service.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # When the upstream fails with 500/502/503/504, serve the JSON error
            # handlers defined above instead of the default NGINX HTML pages.
            proxy_intercept_errors on;
            proxy_pass http://email_ftp_service;
        }

                # ----------------------------
        # CONCRETE MICROSERVICE ROUTES
        # This route rewrites the public gateway path to the backend service path
        # and then proxies the request to `mdm_service`.
        #
        # Example:
        # /api/v1/service/mdm-managment-service/profile
        # becomes:
        # /profile
        #
        # Since this location is more specific than `/api/v1/service/`, this is
        # the block NGINX will choose for matching requests.
        # ----------------------------
        location /api/v1/service/key-vault {
            rewrite ^/api/v1/service/key-vault(/.*)$ $1 break;

            # Forward standard proxy context to the upstream service.
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # When the upstream fails with 500/502/503/504, serve the JSON error
            # handlers defined above instead of the default NGINX HTML pages.
            proxy_intercept_errors on;
            proxy_pass http://key_vault_service;
        }
        
    }
}
